# ─────────────────────────────────────────────────────────────────────────────
# vergoboy.ir — nginx snippets for the SECOND instance, /w2g/
#
# This is the /w2g counterpart of deploy/nginx-stream.conf. Paste these
# locations into the SAME server{} block that already serves the original
# /stream instance (see that file for the http{}-level prerequisites), then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Assumes the app lives at /opt/w2g (code under /opt/w2g/current, a symlink to
# /opt/w2g/releases/<utc-ts>) and binds 127.0.0.1:8802. Mutable state — media,
# data, hls-live — lives outside the release dirs so it survives an upgrade.
#
# Deliberately NOT redefined here, because they are instance-global and the
# /stream snippet already declares them in the same server{} block — a second
# `location /hls/` (etc.) would make `nginx -t` fail:
#   /hls/            (RTMP remux output)
#   /whip/           (MediaMTX browser-capture ingest)
#   /livekit/…       (LiveKit SFU signal)
# w2g gets its own /w2g/hls/ prefix instead, so the two instances never share a
# live namespace; point the app at it with:
#   STREAM_HLS_PLAYBACK_TEMPLATE=https://vergoboy.ir/w2g/hls/live/{key}/index.m3u8
# ─────────────────────────────────────────────────────────────────────────────

# Content-hashed JS/CSS — immutable, cache forever.
location /w2g/_next/ {
    alias /opt/w2g/current/webapp-out/_next/;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# The page itself + every other root-level static file (favicon.svg, 404.html).
# Served from disk, not through Flask. HTML must not be cached so browsers
# always pick up the latest build (the _next/ assets above are hashed).
location /w2g/ {
    alias /opt/w2g/current/webapp-out/;
    try_files $uri $uri/index.html /index.html =404;
    add_header Cache-Control "no-cache, must-revalidate";
}
location = /w2g {
    return 301 /w2g/;
}

# Uploaded videos, subtitles, chat images, avatars — off disk with Range support
# (seeking needs it), so video bytes never pass through Flask.
location /w2g/media/ {
    alias /opt/w2g/media/;
    add_header Accept-Ranges bytes;
    expires 7d;
    add_header Cache-Control "public";
}

# Progressive HLS — the .m3u8 playlists GROW while ffmpeg encodes, so they must
# never be cached or hls.js keeps re-reading a stale 2-3 segment playlist.
# These regex locations override the /w2g/media/ prefix block above.
location ~* ^/w2g/media/hls/(?<hlsfile>.*\.m3u8)$ {
    alias /opt/w2g/media/hls/$hlsfile;
    types { application/vnd.apple.mpegurl m3u8; }
    add_header Accept-Ranges bytes;
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate";
}
location ~* ^/w2g/media/hls/(?<hlsfile>.*\.ts)$ {
    alias /opt/w2g/media/hls/$hlsfile;
    types { video/mp2t ts; }
    add_header Accept-Ranges bytes;
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
}

# Live streams (RTMP ingest remuxed to HLS, or MediaMTX browser capture).
# Playlist grows live so it must never be cached; segments are immutable.
location /w2g/hls/ {
    alias /opt/w2g/hls-live/;
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate";
}

# REST API → Flask. Long timeouts: imports and uploads can take minutes.
location /w2g/api/ {
    proxy_pass http://127.0.0.1:8802/w2g/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# Socket.IO → Flask, with the WebSocket upgrade headers.
location /w2g/socket.io {
    proxy_pass http://127.0.0.1:8802/w2g/socket.io;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
}
