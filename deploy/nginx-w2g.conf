# ─────────────────────────────────────────────────────────────────────────────
# vergoboy.ir — nginx snippets for the SECOND instance, /w2g/
#
# This is the /w2g counterpart of deploy/nginx-stream.conf. Its locations go in
# the SAME server{} block that already serves the original /stream instance —
# but through an include, not a paste, so reverting is one line:
#   sudo install -m 0644 deploy/nginx-w2g.conf /etc/nginx/snippets/vergoboy-w2g.conf
#   # then, inside that server{} block:  include /etc/nginx/snippets/vergoboy-w2g.conf;
#   sudo nginx -t && sudo systemctl reload nginx
# See docs/DEPLOY_PLAN.md (steps S9/S11) for the exact, reversible procedure.
# The http{}-level prerequisites this relies on ($connection_upgrade, the
# upgrade map) are the ones nginx-stream.conf already documents and the server
# already has — this file adds no http{}-level directive.
#
# Assumes the app lives at /opt/w2g (code under /opt/w2g/current, a symlink to
# /opt/w2g/releases/<utc-ts>) and binds 127.0.0.1:8802. Mutable state — media and
# data — lives outside the release dirs so it survives an upgrade.
#
# Deliberately NOT redefined here, because they are instance-global and the
# /stream snippet already declares them in the same server{} block — a second
# `location /hls/` (etc.) would make `nginx -t` fail:
#   /hls/            (RTMP remux output)  ← w2g plays its live streams from here too
#   /whip/           (MediaMTX browser-capture ingest)
#   /livekit/rtc/…   (LiveKit SFU signal)
# The only /livekit/ thing added here is the EXACT-match `= /livekit/` health
# passthrough below: the app's health probe GETs {LIVEKIT_URL}/ = /livekit/ ,
# which had no route at all (404 → livekit:false → 503). Exact match cannot
# collide with the existing prefix `location /livekit/rtc/`.
# w2g shares the /hls/ namespace rather than getting its own: the RTMP ingest
# writes a single directory configured on the server, so a /w2g/hls/ location
# would alias a directory nothing writes. Splitting it per instance means
# changing the ingest config first — see docs/FOLLOWUPS.md.
# ─────────────────────────────────────────────────────────────────────────────

# Content-hashed JS/CSS — immutable, cache forever.
location /w2g/_next/ {
    alias /opt/w2g/current/webapp-out/_next/;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# The page itself + every other root-level static file (favicon.svg, 404.html).
# Served from disk, not through Flask. HTML must not be cached so browsers
# always pick up the latest build (the _next/ assets above are hashed).
location /w2g/ {
    alias /opt/w2g/current/webapp-out/;
    try_files $uri $uri/index.html /index.html =404;
    add_header Cache-Control "no-cache, must-revalidate";
}
location = /w2g {
    return 301 /w2g/;
}

# Uploaded videos, subtitles, chat images, avatars — off disk with Range support
# (seeking needs it), so video bytes never pass through Flask.
location /w2g/media/ {
    alias /opt/w2g/media/;
    add_header Accept-Ranges bytes;
    expires 7d;
    add_header Cache-Control "public";
}

# Progressive HLS — the .m3u8 playlists GROW while ffmpeg encodes, so they must
# never be cached or hls.js keeps re-reading a stale 2-3 segment playlist.
# These regex locations override the /w2g/media/ prefix block above.
location ~* ^/w2g/media/hls/(?<hlsfile>.*\.m3u8)$ {
    alias /opt/w2g/media/hls/$hlsfile;
    types { application/vnd.apple.mpegurl m3u8; }
    add_header Accept-Ranges bytes;
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate";
}
location ~* ^/w2g/media/hls/(?<hlsfile>.*\.ts)$ {
    alias /opt/w2g/media/hls/$hlsfile;
    types { video/mp2t ts; }
    add_header Accept-Ranges bytes;
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
}

# Live streams (RTMP ingest remuxed to HLS) are NOT given a /w2g/ location —
# see the header: the ingest writes one instance-global directory and /hls/ in
# the same server{} block already serves it. Adding a /w2g/hls/ alias here
# would return empty playlists from a directory nothing writes.

# REST API → Flask. Long timeouts: imports and uploads can take minutes.
location /w2g/api/ {
    proxy_pass http://127.0.0.1:8802/w2g/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# Socket.IO → Flask, with the WebSocket upgrade headers.
location /w2g/socket.io {
    proxy_pass http://127.0.0.1:8802/w2g/socket.io;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
}

# Health probe target. _probe_livekit() derives https://vergoboy.ir/livekit/
# from STREAM_LIVEKIT_URL and needs a 2xx; the SFU answers plain "OK" on its
# root. This benefits BOTH instances' health endpoints — /stream's current
# build has no health route, so nothing there changes behaviour.
location = /livekit/ {
    proxy_pass http://127.0.0.1:7880/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Room sync WebSocket (w2g-server timing authority)
location /w2g/sync {
    proxy_pass http://127.0.0.1:8765/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
}
