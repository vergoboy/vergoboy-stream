# ─────────────────────────────────────────────────────────────────────────────
# vergoboy.ir — nginx snippets for /stream/
#
# Paste these locations into the server{} block that serves your domain, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Needs, in the http{} block:
#   map $http_upgrade $connection_upgrade { default upgrade; '' close; }
# and in the server{} block:
#   client_max_body_size 8192m;   # must match STREAM_MAX_UPLOAD_MB
#
# Assumes the app lives at /opt/stream and binds 127.0.0.1:8801.
# ─────────────────────────────────────────────────────────────────────────────

# Content-hashed JS/CSS — immutable, cache forever.
location /stream/_next/ {
    alias /opt/stream/webapp-out/_next/;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# The page itself + every other root-level static file (favicon.svg, 404.html).
# Served from disk, not through Flask. HTML must not be cached so browsers
# always pick up the latest build (the _next/ assets above are hashed).
location /stream/ {
    alias /opt/stream/webapp-out/;
    try_files $uri $uri/index.html /index.html =404;
    add_header Cache-Control "no-cache, must-revalidate";
}
location = /stream {
    return 301 /stream/;
}

# Uploaded videos, subtitles, chat images, avatars — off disk with Range support
# (seeking needs it), so video bytes never pass through Flask.
location /stream/media/ {
    alias /opt/stream/media/;
    add_header Accept-Ranges bytes;
    expires 7d;
    add_header Cache-Control "public";
}

# Progressive HLS — the .m3u8 playlists GROW while ffmpeg encodes, so they must
# never be cached or hls.js keeps re-reading a stale 2-3 segment playlist.
# These regex locations override the /stream/media/ prefix block above.
location ~* ^/stream/media/hls/(?<hlsfile>.*\.m3u8)$ {
    alias /opt/stream/media/hls/$hlsfile;
    types { application/vnd.apple.mpegurl m3u8; }
    add_header Accept-Ranges bytes;
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate";
}
location ~* ^/stream/media/hls/(?<hlsfile>.*\.ts)$ {
    alias /opt/stream/media/hls/$hlsfile;
    types { video/mp2t ts; }
    add_header Accept-Ranges bytes;
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
}

# Live streams (RTMP ingest remuxed to HLS, or MediaMTX browser capture).
# Playlist grows live so it must never be cached; segments are immutable.
location /hls/ {
    alias /opt/stream/hls-live/;
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate";
}

# WHIP — browser screen-share ingest → MediaMTX on 127.0.0.1:8889.
# The RTP/RTCP does NOT traverse nginx; it goes straight to MediaMTX's UDP port.
location /whip/ {
    rewrite ^/whip/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8889;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
}

# REST API → Flask. Long timeouts: imports and uploads can take minutes.
location /stream/api/ {
    proxy_pass http://127.0.0.1:8801/stream/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# Socket.IO → Flask, with the WebSocket upgrade headers.
location /stream/socket.io {
    proxy_pass http://127.0.0.1:8801/stream/socket.io;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
}

# LiveKit voice room — signal WebSocket + token validate endpoint.
# Media (RTP/RTCP) bypasses nginx and uses the SFU's UDP ports directly.
location = /livekit {
    return 308 /livekit/;
}
location ^~ /livekit/ {
    rewrite ^/livekit/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:7880;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
}
location /livekit/rtc/ {
    proxy_pass http://127.0.0.1:7880/rtc/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
}
location = /livekit/rtc {
    proxy_pass http://127.0.0.1:7880/rtc;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
}