# =====================================================================
# vergoboy.ir — Nginx reverse-proxy config for /stream
# این بلوک رو داخل سرور بلاک موجود vergoboy.ir (همونی که /register و
# /donate رو هندل می‌کنه) قرار بده.
# =====================================================================

# برای ساپورت WebSocket (مورد نیاز Socket.IO)؛ این map رو در سطح http{} (خارج
# از server{}) یک بار تعریف کن — اگه از قبل برای بخش‌های دیگه سایت همین map رو
# داری، دوباره تعریفش نکن.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # ... بقیه‌ی تنظیمات سرور (ssl, server_name, /register, /donate و ...) ...

    # حجم آپلود ویدیو می‌تونه بزرگ باشه؛ این مقدار رو با نیاز واقعی خودت تنظیم کن
    client_max_body_size 8G;

    # ---------------- اپ Flask + Socket.IO (صفحه و API و WebSocket) ----------------
    location /stream/ {
        proxy_pass http://127.0.0.1:8801/stream/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # برای آپلود فایل‌های بزرگ، زمان بیشتری بده
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    # ---------------- سرو مستقیم فایل‌های ویدیویی آپلودشده ----------------
    # سریع‌تر از عبور دادن از Flask و با پشتیبانی صحیح از Range requests (لازم
    # برای seek کردن داخل ویدیو). این location باید قبل از location /stream/
    # بالا قرار بگیره یا Nginx به‌خوبی بین این دو تشخیص بده (هر دو با /stream/
    # شروع می‌شن، پس ترتیب مهمه: اختصاصی‌تر اول).
    location /stream/media/ {
        alias /opt/stream/media/;
        add_header Accept-Ranges bytes;
        # کش نسبتاً طولانی برای فایل‌های ویدیوی آپلودشده
        expires 7d;
        add_header Cache-Control "public";
    }
}
