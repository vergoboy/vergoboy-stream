# Original (non-transcoded) media for native clients, verified by nginx `secure_link`.
# Put this inside the server{} block that already contains `location /w2g/media/ { alias /opt/w2g/media/; }`.
#
# One-time server setup:
#   1. pick a secret (>= 32 chars) and set it for Flask:   STREAM_NATIVE_MEDIA_SECRET=<secret>
#   2. create /etc/nginx/w2g-media-secret.conf (root:www-data, mode 640) containing exactly:
#          set $w2g_media_secret "<secret>";
#   3. keep STREAM_NATIVE_MEDIA_BASE (default /w2g/native/uploads) equal to the location below.
#
# URL format (made by native_media.py): <path>?exp=<unix>&u=<user id>&md5=<base64url md5>
# The signature covers expiry + exact path + user id. Range requests are served by nginx itself.

location ^~ /w2g/native/uploads/ {
    include /etc/nginx/w2g-media-secret.conf;
    secure_link     $arg_md5,$arg_exp;
    secure_link_md5 "$secure_link_expires$uri$arg_u $w2g_media_secret";
    if ($secure_link = "")  { return 403; }   # missing / wrong signature
    if ($secure_link = "0") { return 410; }   # signature fine, link expired
    alias /opt/w2g/media/uploads/;
    add_header Cache-Control "private, no-store" always;
}

# The raw uploads used to be public through `location /w2g/media/`. Close that hole.
# (Subtitles, chat images and avatars under /w2g/media/ are unchanged.)
location ^~ /w2g/media/uploads/ { return 404; }
