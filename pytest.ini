[pytest]
# The 170 unittest.TestCase tests already covering media_pipeline/ are
# collected unchanged alongside the new suites; pytest runs plain
# unittest.TestCase classes natively, so there is one entry point for all of it.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -ra: show a reason for every skip. The integration suite skips a lot on
# machines without ffmpeg or without the encoders a fixture needs, and a silent
# skip is indistinguishable from a passing test.
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --durations=10

markers =
    integration: spawns real ffmpeg/ffprobe processes. Needs a working ffmpeg on
        PATH; skipped automatically when it is missing or lacks an encoder a
        given fixture requires.
    fault: drives a fake ffmpeg via STREAM_FFMPEG_BIN to inject hangs, crashes,
        garbage output and disk exhaustion. No real encoding happens.
    socket: boots an embedded postgres (pgserver) plus a real Flask-SocketIO
        server and connects genuine python-socketio clients to it.
    slow: takes more than a few seconds (long encodes, timeout/backoff waits).

# NOTE: no `env =` section on purpose. That key belongs to pytest-env, which is
# not installed, and --strict-config would turn the unknown key into a hard
# error. Tests that need environment variables set them in-process (via
# monkeypatch) instead, so nothing leaks between tests or into the developer's
# real .stream_db.env.
